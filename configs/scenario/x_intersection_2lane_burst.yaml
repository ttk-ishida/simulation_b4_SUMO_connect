# X-intersection scenario with burst load enabled.

sumo:
  # Relative to paths.scenario_dir (in base.yaml or this file)
  sumocfg_path: "x_intersection_2lane/sumo.sumocfg"
  gui: false
  additional_traci_cmd: []

rsu:
  x_m: 500.0
  y_m: 500.0
  coverage_radius_m: 250.0

traffic:
  notes: "Demand controlled by routes.rou.xml unless overridden in runner."

burst:
  enabled: true
  mu_schedule:
    - { t_start_s: 0,   t_end_s: 200, mu: 0.10 }
    - { t_start_s: 200, t_end_s: 320, mu: 0.10 }
    - { t_start_s: 320, t_end_s: 1800, mu: 0.10 }

prediction:
  inflow_estimator:
    name: "from_profile"
  inflow_profile:
    segments:
      - { t_start_s: 0, t_end_s: 200, rate_veh_per_s: 0.2 }
      - { t_start_s: 200, t_end_s: 320, rate_veh_per_s: 0.4 }
      - { t_start_s: 320, t_end_s: 1800, rate_veh_per_s: 0.2 }
