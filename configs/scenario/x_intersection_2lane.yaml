# Scenario-specific configuration for a single 2-lane X intersection.

sumo:
  # Relative to paths.scenario_dir (in base.yaml or this file)
  sumocfg_path: "x_intersection_2lane/sumo.sumocfg"
  gui: false
  additional_traci_cmd: []

rsu:
  x_m: 500.0
  y_m: 500.0
  coverage_radius_m: 1000.0

traffic:
  notes: "Demand controlled by routes.rou.xml unless overridden in runner."

prediction:
  inflow_estimator:
    name: "from_profile"
  inflow_profile:
    segments:
      - { t_start_s: 0, t_end_s: 600, rate_veh_per_s: 0.2 }
