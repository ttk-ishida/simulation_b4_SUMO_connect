# Traffic burst configuration (optional).
# Implement in runner: override per-vehicle task rate mu(t) OR vehicle inflow OR both.
# Here we focus on per-vehicle task generation rate mu(t) change to emulate sudden load increase.

burst:
  enabled: true
  # Piecewise schedule for mu (tasks/s/vehicle)
  # Times are absolute simulation times [s].
  mu_schedule:
    - { t_start_s: 0,   t_end_s: 200, mu: 0.05 }
    - { t_start_s: 200, t_end_s: 320, mu: 0.05 }   # burst window
    - { t_start_s: 320, t_end_s: 1800, mu: 0.05 }

prediction:
  inflow_estimator:
    name: "from_profile"
  inflow_profile:
    segments:
      - { t_start_s: 0, t_end_s: 200, rate_veh_per_s: 0.2 }
      - { t_start_s: 200, t_end_s: 320, rate_veh_per_s: 0.4 }
      - { t_start_s: 320, t_end_s: 1800, rate_veh_per_s: 0.2 }
