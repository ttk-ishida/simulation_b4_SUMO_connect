# Traffic burst configuration (optional).
# Implement in runner: override per-vehicle task rate mu(t) OR vehicle inflow OR both.
# Here we focus on per-vehicle task generation rate mu(t) change to emulate sudden load increase.

burst:
  enabled: true
  # Piecewise schedule for mu (tasks/s/vehicle)
  # Times are absolute simulation times [s].
  mu_schedule:
    - { t_start_s: 0,   t_end_s: 200, mu: 0.03 }
    - { t_start_s: 200, t_end_s: 320, mu: 0.12 }   # burst window
    - { t_start_s: 320, t_end_s: 600, mu: 0.03 }

prediction:
  inflow_estimator:
    # Optionally tie synthetic inflow estimator to the burst schedule
    name: "synthetic_from_edges"
    params:
      base_entry_prob: 0.35
      noise_std: 0.05
